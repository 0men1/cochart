services:
  api:
    build:
      context: .                      # repo root — workspace monorepo
      dockerfile: server/Dockerfile
    image: cochart-server
    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      ROOM_DB_PATH: /data/rooms.db
      TRUST_PROXY: "1"

    # Persist the SQLite room store across restarts/rebuilds.
    volumes:
      - cochart-data:/data

    # Node 22 has a global fetch; no curl/wget in the slim image.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/search?q=btc&l=1').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  cochart-data:
